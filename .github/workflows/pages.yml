# 公開ページの更新にだけ使う（取得・記録・定期実行には使わない）。push されたとき public/ をそのまま配信する。
# 鍵は使わない: 配信は GITHUB_TOKEN（このワークフローの実行中だけ有効）で行う。
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: public/ に置いてよい種類だけか確かめる（html/json/jsonl/png/txt/css）
        run: |
          bad=$(find public -type f ! \( -name '*.html' -o -name '*.json' -o -name '*.jsonl' -o -name '*.png' -o -name '*.txt' -o -name '*.css' \) | head -5)
          if [ -n "$bad" ]; then echo "許可していない種類のファイル:"; echo "$bad"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
